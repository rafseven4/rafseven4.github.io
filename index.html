<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Travel Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1814;
      --paper: #f5f2eb;
      --accent: #c0392b;
      --muted: #8c8479;
      --visited: #7F77DD;
      --visited-hover: #534AB7;
      --border: rgba(26,24,20,0.12);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    header {
      padding: 48px 40px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    header p {
      font-size: 14px;
      color: var(--muted);
      max-width: 280px;
      text-align: right;
      line-height: 1.6;
    }

    .stats {
      display: flex;
      gap: 0;
      border-bottom: 1px solid var(--border);
    }

    .stat {
      flex: 1;
      padding: 20px 40px;
      border-right: 1px solid var(--border);
    }
    .stat:last-child { border-right: none; }

    .stat-number {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent);
      line-height: 1;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 4px;
    }

    .map-section {
      padding: 32px 40px 0;
    }

    #map { width: 100%; }
    #map svg { display: block; width: 100%; }

    .country-visited {
      fill: var(--visited);
      cursor: pointer;
      transition: fill 0.15s;
    }
    .country-visited:hover { fill: var(--visited-hover); }
    .country-default { fill: #d4cfc5; stroke: #f5f2eb; stroke-width: 0.5; }

    #tooltip {
      position: fixed;
      background: var(--ink);
      color: var(--paper);
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s;
      white-space: nowrap;
      z-index: 100;
    }

    .places-section {
      padding: 24px 40px 48px;
      border-top: 1px solid var(--border);
      margin-top: 24px;
    }

    .places-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .pill {
      background: transparent;
      border: 1px solid var(--visited);
      color: var(--visited-hover);
      border-radius: 100px;
      padding: 5px 16px;
      font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      cursor: default;
      transition: background 0.15s;
    }

    .pill:hover {
      background: var(--visited);
      color: #fff;
    }

    @media (max-width: 600px) {
      header, .stat, .map-section, .places-section { padding-left: 20px; padding-right: 20px; }
      header p { text-align: left; }
      .stat { padding: 16px 20px; }
    }
  </style>
</head>
<body>

<div id="tooltip"></div>

<header>
  <h1>Places I've<br>been to</h1>
  <p>Every country I've set foot in, marked on the map.</p>
</header>

<div class="stats">
  <div class="stat">
    <div class="stat-number" id="cnt">5</div>
    <div class="stat-label">Countries</div>
  </div>
  <div class="stat">
    <div class="stat-number" id="pct">3%</div>
    <div class="stat-label">Of the world</div>
  </div>
  <div class="stat">
    <div class="stat-number">3</div>
    <div class="stat-label">Continents</div>
  </div>
</div>

<div class="map-section">
  <div id="map"></div>
</div>

<div class="places-section">
  <div class="places-label">Visited places</div>
  <div class="pills" id="pills"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script>
  const visited = {
    "Brazil":                    "Home",
    "Argentina":                 "Buenos Aires",
    "United States of America":  "USA",
    "France":                    "Paris",
    "Portugal":                  "Lisbon",
  };

  const tip = document.getElementById('tooltip');
  const pills = document.getElementById('pills');

  Object.entries(visited).forEach(([name, note]) => {
    const p = document.createElement('span');
    p.className = 'pill';
    p.textContent = note || name;
    pills.appendChild(p);
  });

  document.getElementById('cnt').textContent = Object.keys(visited).length;
  document.getElementById('pct').textContent = Math.round(Object.keys(visited).length / 195 * 100) + '%';

  const svg = d3.select('#map').append('svg').attr('viewBox', '0 0 960 500').attr('width', '100%');
  const proj = d3.geoNaturalEarth1().scale(158).translate([480, 260]);
  const path = d3.geoPath(proj);

  d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(world => {
    const features = topojson.feature(world, world.objects.countries).features;

    svg.selectAll('path')
      .data(features)
      .join('path')
      .attr('d', path)
      .attr('class', d => visited[d.properties?.name] ? 'country-visited' : 'country-default')
      .attr('stroke', '#f5f2eb')
      .attr('stroke-width', 0.5)
      .on('mousemove', function(event, d) {
        const name = d.properties?.name || '';
        if (!visited[name]) return;
        tip.style.left = (event.clientX + 14) + 'px';
        tip.style.top  = (event.clientY - 32) + 'px';
        tip.style.opacity = '1';
        tip.textContent = visited[name] ? name + (visited[name] !== name ? ' — ' + visited[name] : '') : name;
      })
      .on('mouseleave', () => { tip.style.opacity = '0'; });
  });
</script>
</body>
</html>
